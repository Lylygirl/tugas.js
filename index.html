<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar JavaScript</title>
  <link rel="stylesheet" href="js.css">
</head>
<body>
  <div class="buttons">
    <button onclick="gantiMode()">🌙 Mode Malam</button>
    <button onclick="tambahCard()">+ Tambah Card</button>
  </div>

  <div id="cardContainer" class="card-container"></div>

  <div class="bottom-buttons">
    <button onclick="tampilForm()" >📄 Tampilkan Form</button>
    <button onclick="cariKOM()">🔍 Cari KOM Mahasiswa</button>
  </div>

  <div id="popupForm" class="popup">
    <div class="form-box">
      <span class="tutup" onclick="tutupForm()">✖</span>
      <h1>Form Data</h1>
      <label>Nama:</label>
      <input type="text" id="nama" placeholder="Nama">
      <label>Email:</label>
      <input type="text" id="email" placeholder="Emai">

      <button onclick="tutupForm()">Tutup</button>
    </div>
  </div>

  <script src="js.js"></script>
</body>
</html>
